<svg width="850" height="312" viewBox="0 0 850 312" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Claude Code agent roster">
  <defs><filter id="noise-t-light">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55, 0 0 0 0 0.55, 0 0 0 0 0.6, 0 0 0 0.05 0"/>
    </filter></defs>
  <rect x="0.5" y="0.5" width="849" height="311" rx="15.5" fill="#FCFCFD" stroke="#E6E6EA"/>
  <rect width="850" height="312" filter="url(#noise-t-light)" opacity="1"/>
  <text x="34" y="42" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#6E6E78">CLAUDE CODE — AGENT ROSTER</text>
  <circle cx="762" cy="38" r="2.5" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="816" y="42" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#3FB950">6/6</text>
