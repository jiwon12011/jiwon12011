<svg width="850" height="300" viewBox="0 0 850 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JIWON — Design, then build.">
  <defs>
    <clipPath id="f-h-light"><rect width="850" height="300" rx="16"/></clipPath>
    <filter id="noise-h-light">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55, 0 0 0 0 0.55, 0 0 0 0 0.6, 0 0 0 0.05 0"/>
    </filter>
    <filter id="soft-h-light" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="acc-h-light" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#f-h-light)">
    <rect width="850" height="300" fill="#FCFCFD"/>
    <g filter="url(#soft-h-light)">
      <ellipse cx="790" cy="10" rx="240" ry="150" fill="#EC4899" opacity="0.20">
        <animateTransform attributeName="transform" type="translate" values="0 0;-40 24;0 0" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </ellipse>
      <ellipse cx="60" cy="300" rx="220" ry="130" fill="#8B5CF6" opacity="0.15">
        <animateTransform attributeName="transform" type="translate" values="0 0;36 -20;0 0" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </ellipse>
    </g>
    <rect width="850" height="300" filter="url(#noise-h-light)" opacity="1"/>

    <!-- top meta -->
    <text x="36" y="44" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#6E6E78">JIWON — PROFILE</text>
    <text x="814" y="44" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="2" fill="#6E6E78">SEOUL, KR · UTC+9</text>
    <rect x="36" y="58" width="778" height="1" fill="#E6E6EA"/>

    <!-- display -->
    <text x="34" y="145" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#131318">Design,</text>
    <text x="34" y="207" font-family="'Helvetica Neue',-apple-system,'Segoe UI',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#131318">then <tspan fill="url(#acc-h-light)">build.</tspan></text>

    <!-- korean sub with blinking caret prompt -->
    <rect x="36" y="230" width="6.5" height="14" fill="#EC4899">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="52" y="242" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif" font-size="13" fill="#6E6E78">기획부터 구현까지, 감각을 코드로 잇는 디자이너</text>

    <!-- bottom row -->
    <rect x="36" y="262" width="778" height="1" fill="#E6E6EA"/>
    <text x="36" y="284" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#9A9AA4">WEB PLANNER · UI/UX DESIGNER</text>
    <circle cx="742" cy="280" r="2.5" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="752" y="284" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#9A9AA4">ACTIVE</text>

    <rect x="0.5" y="0.5" width="849" height="299" rx="15.5" stroke="#E6E6EA" fill="none"/>
  </g>
</svg>
